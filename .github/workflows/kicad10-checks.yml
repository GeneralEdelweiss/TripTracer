name: KiCad 10 electrical and PCB checks

on:
  push:
    branches: [design/solid-state-power-v1]
    paths:
      - 'hardware/kicad/**'
      - '.github/workflows/kicad10-checks.yml'
      - 'tools/check_kicad_hierarchy.py'
      - 'tools/triage_kicad_erc.py'
      - 'tools/check_kicad_custom_pinouts.py'
      - 'tools/check_simple_input_netlist.py'
      - 'tools/check_triptracer_powerpath_v2.py'
      - 'tools/export_power_bom_v2.py'
      - 'tools/check_lmr38020_netlist.py'
      - 'tools/check_lmr38020_pcb_pads.py'
      - 'tools/check_acc_vin_startup.py'
      - 'tools/check_acc_hold_prearm.py'
      - 'tools/check_input_protection_envelope.py'
      - 'tools/check_supply_harness.py'
      - 'tools/check_cots_power_selection.py'
      - 'tools/check_power_frontend_design_freeze.py'
      - 'hardware/kicad/power_selection.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kicad10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kicad:
    # No hosted runs once the temporary public development phase ends.
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/design/solid-state-power-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: kicad/kicad:10.0
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          mkdir -p reports "$HOME/.config"
          cp -r /home/kicad/.config/kicad "$HOME/.config/"
          kicad-cli version | tee reports/kicad-version.txt
          printf '%s\n' "$GITHUB_SHA" | tee reports/commit.txt
          printf 'NO manufacturing or vehicle approval.\n' > reports/STATUS.txt
      - name: Check hierarchy and unique references
        id: hierarchy
        continue-on-error: true
        run: |
          python3 tools/check_kicad_hierarchy.py hardware/kicad/TripTracer_V1.kicad_sch | tee reports/hierarchy.json
      - name: Check custom safety-critical symbol pinouts
        id: pinouts
        continue-on-error: true
        run: python3 tools/check_kicad_custom_pinouts.py
      - name: Verify actual COTS power stage and release blockers
        id: cots
        continue-on-error: true
        run: python3 tools/check_cots_power_selection.py | tee reports/cots-selection.json
      - name: Verify planned LM74800 MPNs and passive procurement BOM (NOT active)
        id: freeze
        continue-on-error: true
        run: python3 tools/check_power_frontend_design_freeze.py | tee reports/power-front-end-freeze.json
      - name: ERC on complete root hierarchy
        id: erc
        continue-on-error: true
        run: |
          kicad-cli sch erc --severity-all --exit-code-violations --format json \
            -o reports/erc.json hardware/kicad/TripTracer_V1.kicad_sch 2>&1 | tee reports/erc.log
      - name: Summarize ERC violations by sheet and type
        if: always()
        run: |
          if test -s reports/erc.json; then
            python3 tools/triage_kicad_erc.py reports/erc.json reports/erc-triage.md
            cat reports/erc-triage.md | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: DRC including schematic parity
        id: drc
        continue-on-error: true
        run: |
          kicad-cli pcb drc --severity-all --all-track-errors --schematic-parity \
            --refill-zones --exit-code-violations --format json \
            -o reports/drc.json hardware/kicad/TripTracer_V1.kicad_pcb 2>&1 | tee reports/drc.log
      - name: Export native netlist
        id: netlist
        continue-on-error: true
        run: |
          kicad-cli sch export netlist -o reports/TripTracer.net \
            hardware/kicad/TripTracer_V1.kicad_sch 2>&1 | tee reports/netlist.log
      - name: Assert new simple input diode and TVS from native KiCad netlist
        id: powerpath
        continue-on-error: true
        run: |
          python3 tools/check_simple_input_netlist.py reports/TripTracer.net | tee reports/powerpath.log
          python3 tools/check_input_protection_envelope.py | tee reports/input-protection-envelope.json
          python3 tools/check_supply_harness.py reports/vehicle-harness-candidate.csv | tee reports/supply-harness.json
      - name: Assert LMR38020-Q1 buck topology from native KiCad netlist
        id: newbuck
        continue-on-error: true
        run: |
          python3 tools/check_lmr38020_netlist.py reports/TripTracer.net | tee reports/newbuck.log
      - name: Check LMR38020 physical PCB pin nets
        id: pcbbuck
        continue-on-error: true
        run: python3 tools/check_lmr38020_pcb_pads.py | tee reports/pcb-buck-pad-map.json
      - name: Assert ACC cold-start HOLD GPIO USB-M8 priority 3V3 power path
        id: newpowerpath
        continue-on-error: true
        run: |
          python3 tools/check_triptracer_powerpath_v2.py reports/TripTracer.net | tee reports/powerpath-v2.log
          python3 tools/check_acc_vin_startup.py | tee reports/acc-vin-startup.json
          python3 tools/check_acc_hold_prearm.py | tee reports/acc-hold-prearm.json
      - name: Export active low-cost supply BOM from native KiCad netlist
        id: powerbom
        continue-on-error: true
        run: |
          python3 tools/export_power_bom_v2.py reports/TripTracer.net reports/power-bom-v2.csv | tee reports/power-bom.log
      - name: Export complete hierarchical schematic PDF for review
        id: schematicpdf
        continue-on-error: true
        run: |
          kicad-cli sch export pdf -o reports/TripTracer-schematic.pdf hardware/kicad/TripTracer_V1.kicad_sch
      - name: Preserve reports even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad10-${{ github.sha }}
          path: reports/
          retention-days: 14
          if-no-files-found: error
      - name: Enforce failed checks
        if: always()
        env:
          COTS: ${{ steps.cots.outcome }}
          FREEZE: ${{ steps.freeze.outcome }}
          PCBBUCK: ${{ steps.pcbbuck.outcome }}
          SCHEMATICPDF: ${{ steps.schematicpdf.outcome }}
          ERC: ${{ steps.erc.outcome }}
          DRC: ${{ steps.drc.outcome }}
          NETLIST: ${{ steps.netlist.outcome }}
          HIERARCHY: ${{ steps.hierarchy.outcome }}
          PINOUTS: ${{ steps.pinouts.outcome }}
          POWERPATH: ${{ steps.powerpath.outcome }}
          NEWBUCK: ${{ steps.newbuck.outcome }}
          NEWPOWERPATH: ${{ steps.newpowerpath.outcome }}
          POWERBOM: ${{ steps.powerbom.outcome }}
        run: |
          printf '### KiCad 10 results\n\nERC: %s\n\nDRC: %s\n\nNetlist: %s\n\nNo manufacturing or vehicle approval.\n' \
            "$ERC" "$DRC" "$NETLIST" >> "$GITHUB_STEP_SUMMARY"
          printf '\nHierarchy and annotation: %s\n' "$HIERARCHY" >> "$GITHUB_STEP_SUMMARY"
          test "$COTS" = success && test "$FREEZE" = success && test "$PCBBUCK" = success && test "$SCHEMATICPDF" = success && test "$HIERARCHY" = success && test "$PINOUTS" = success && test "$POWERPATH" = success && test "$NEWBUCK" = success && test "$NEWPOWERPATH" = success && test "$POWERBOM" = success && test "$ERC" = success && test "$DRC" = success && test "$NETLIST" = success
