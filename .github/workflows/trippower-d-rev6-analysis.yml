name: TripPower D REV6 bench readiness and regression checks
on:
  push:
    branches:
      - design/trippower-d-load-dump
    paths:
      - "hardware/modules/TripPower_5V2A/weg_d/**"
      - ".github/workflows/trippower-d-rev6-analysis.yml"
  workflow_dispatch:

jobs:
  static-bench-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only prior A23 calculation dependencies (no new parameter sweep)
        run: python3 -m pip install numpy scipy
      - name: Check Round12 pin mapping, source provenance and missing model markers
        run: python3 hardware/modules/TripPower_5V2A/weg_d/round12_measurement_manifest_gate.py --check-plan
      - name: Round12 synthetic capture-validation regression tests (NOT oscilloscope acquisitions)
        run: python3 -m unittest discover -s hardware/modules/TripPower_5V2A/weg_d -p 'test_round12_measurement_manifest_gate.py' -v
      - name: Preserve Round11 source-vs-pin numerical baseline without new 27-case sweep
        run: python3 -m unittest discover -s hardware/modules/TripPower_5V2A/weg_d -p 'test_tps26631_a23_linear_nodes.py' -v
      - name: Previous bounded voltage/current/cost regressions
        run: python3 -m unittest discover -s hardware/modules/TripPower_5V2A/weg_d -p 'test_rev6_round8.py' -v
      - name: Archive measurement-only specifications (NO real waveforms)
        uses: actions/upload-artifact@v4
        with:
          name: trippower-d-round12-readiness-only-no-pcb-no-hardware
          path: |
            hardware/modules/TripPower_5V2A/weg_d/ROUND12_A23_INSTRUMENTATION_PIN_LIMIT_MATRIX_2026-10-16.csv
            hardware/modules/TripPower_5V2A/weg_d/ROUND12_A23_PARAMETER_PROVENANCE_2026-10-16.csv
            hardware/modules/TripPower_5V2A/weg_d/ROUND12_A23_EMPTY_CAPTURE_MANIFEST_2026-10-16.json
            hardware/modules/TripPower_5V2A/weg_d/WEG_D_ROUND12_A23_INSTRUMENTED_PROTOTYPE_LAB_RELEASE_2026-10-16.md
