name: TripPower Weg A quantified blockers (NOT fabrication)

on:
  push:
    branches: [design/trippower-a]
    paths:
      - 'hardware/modules/TripPower_5V2A/**'
      - 'tools/trippower_a_model.py'
      - 'tools/test_trippower_a_*.py'
      - 'tools/check_trippower_a_netlist.py'
      - 'tools/check_trippower_a_d301_prototype.py'
      - 'tools/trippower_a_d301_backup_analysis.py'
      - 'tools/trippower_a_start_manufacturer_bounds.py'
      - '.github/workflows/trippower-a-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quantitative-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: kicad/kicad:10.0
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare reports and verify KiCad 10 version
        run: |
          mkdir -p reports "$HOME/.config"
          cp -r /home/kicad/.config/kicad "$HOME/.config/"
          kicad-cli version | tee reports/kicad-version.txt
          printf 'SCOPING SCREEN ONLY; P01-P10 OPEN. NO VEHICLE, SURGE, SOA OR FAB RELEASE.\n' >reports/GATE_STATUS.txt
      - name: Run 200V/350ms and 9V state-machine regression tests
        run: |
          python3 -m unittest discover -s tools -p 'test_trippower_a_*.py' -v 2>&1 | tee reports/a-regression-tests.txt
      - name: Export deterministic quantitative cases
        run: |
          python3 tools/trippower_a_model.py --scenario all --pretty > reports/a-200v-9v-model.json
          python3 tools/check_trippower_design_baseline.py > reports/rev5-baseline.json
          python3 tools/trippower_a_start_manufacturer_bounds.py > reports/a-9v-TPS38-vendor-bounds.json
      - name: Run native KiCad 10 ERC (not PCB DRC)
        run: |
          kicad-cli sch erc --severity-all --exit-code-violations --format json \
            -o reports/a-erc.json hardware/modules/TripPower_5V2A/TripPower_5V2A.kicad_sch
      - name: Export KiCad 10 netlist and check real protection path and polarity
        run: |
          kicad-cli sch export netlist -o reports/TripPower_5V2A.net \
            hardware/modules/TripPower_5V2A/TripPower_5V2A.kicad_sch
          python3 tools/check_trippower_native_netlist.py reports/TripPower_5V2A.net \
            > reports/rev5-native-pincheck.json
          python3 tools/check_trippower_a_netlist.py reports/TripPower_5V2A.net \
            > reports/a-protection-pincheck.json
      - name: Validate isolated D306 candidate in KiCad 10, without changing REV5 baseline
        run: |
          cp -a hardware/modules/TripPower_5V2A reports/TripPower_A_Prototype_Build
          cp hardware/modules/TripPower_5V2A/01_Protection_LM74930_D301_BACKUP_PROTOTYPE.kicad_sch \
            reports/TripPower_A_Prototype_Build/01_Protection_LM74930.kicad_sch
          kicad-cli sch erc --severity-all --exit-code-violations --format json \
            -o reports/a-d306-prototype-erc.json reports/TripPower_A_Prototype_Build/TripPower_5V2A.kicad_sch || { cat reports/a-d306-prototype-erc.json; exit 1; }
          kicad-cli sch export netlist -o reports/a-d306-prototype.net \
            reports/TripPower_A_Prototype_Build/TripPower_5V2A.kicad_sch
          python3 tools/check_trippower_a_d301_prototype.py \
            reports/TripPower_5V2A.net reports/a-d306-prototype.net \
            | tee reports/a-d306-prototype-topology.json
          python3 tools/trippower_a_d301_backup_analysis.py | tee reports/a-d306-component-gates.json
      - name: Preserve pass/fail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trippower-a-verification
          path: reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Mark release restriction
        if: always()
        run: |
          printf '### TripPower A — engineering regression only\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Regression pass validates arithmetic + KiCad pin topology, **NOT** physical 9-V start, 200-V/350-ms protection, SOA, PCB or fabrication.\n' >> "$GITHUB_STEP_SUMMARY"
